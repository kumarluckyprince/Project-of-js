<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>Rock Paper Scissors</h1>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box">
        <p>You</p>
        <span id="user-score">0</span>
      </div>
      <div class="score-box">
        <p>Comp</p>
        <span id="comp-score">0</span>
      </div>
    </div>

    <!-- Choice Buttons -->
    <div class="choices">
      <button class="choice-btn" id="rock">🪨 Rock</button>
      <button class="choice-btn" id="paper">📄 Paper</button>
      <button class="choice-btn" id="scissors">✂️ Scissors</button>
    </div>

    <!-- Game Status & Result -->
    <div class="result-section">
      <p>You chose: <strong id="user-choice">-</strong></p>
      <p>Computer chose: <strong id="comp-choice">-</strong></p>
      <h2 id="result-message">Make your move!</h2>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
